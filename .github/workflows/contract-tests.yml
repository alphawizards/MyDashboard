name: Contract tests (upstream APIs)

on:
  schedule:
    - cron: '0 18 * * 1'   # Mondays 18:00 UTC
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_transition/app
    env:
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web_transition/app/package-lock.json
      - run: npm ci
      - run: npm test -- tests/contracts --run
